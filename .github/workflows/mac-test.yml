# Teşhis: GitHub bu depoya hangi Mac sunucularını veriyor? (birkaç dakikalık, sadece bilgi yazdırır)
# Bu dosya değiştiğinde ya da elle çalıştırılınca çalışır.
name: Mac sunucu testi

on:
  push:
    branches: ['claude/expo-setup-guide-9xz45k']
    paths: ['.github/workflows/mac-test.yml']
  workflow_dispatch:

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        label: [macos-latest, macos-15-intel, macos-26]
    runs-on: ${{ matrix.label }}
    timeout-minutes: 5
    steps:
      - run: echo "Mac sunucusu verildi (${{ matrix.label }})" && uname -m && sw_vers && ls -d /Applications/Xcode_*.app
