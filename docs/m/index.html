<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cupped · Damak Uyumu</title>
<meta name="description" content="Bir arkadaşın Cupped damak kodunu paylaştı. Ne kadar uyumlusunuz, Cupped'da gör.">
<link rel="icon" href="../icon.png">
<style>
  :root { --bg: #FAF8F5; --text: #1C1410; --muted: #6E655E; --brand: #D98B2B; --card: #FFFFFF; --line: #ECE6DF; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17110D; --text: #F4EDE6; --muted: #B3A89F; --card: #221A15; --line: #3A2E26; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 17px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 48px 16px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { font-family: Georgia, serif; font-size: 30px; margin: 18px 0 8px; }
  .code { display: inline-block; margin: 14px 0; padding: 12px 20px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); font: 700 28px/1 ui-monospace, Menlo, monospace; letter-spacing: 2px; }
  p { color: var(--muted); margin: 8px 0; }
  a.b { display: inline-block; margin-top: 16px; padding: 14px 24px; border-radius: 999px; background: var(--brand); color: #fff; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <img src="../icon.png" alt="Cupped">
  <h1>Damak Uyumu</h1>
  <p>Bir arkadaşın Cupped damak kodunu paylaştı:</p>
  <div class="code" id="code">—</div>
  <p>Cupped yüklüyse aşağıdaki düğmeyle açılır ve uyumunuz hemen hesaplanır.</p>
  <a class="b" id="open" href="cupped://match">Cupped'da aç</a>
  <p style="margin-top:24px">Cupped henüz yüklü değilse: uygulama yakında App Store'da. Yükledikten sonra Profil › Damak Uyumu'na bu kodu yaz.</p>
  <p><a href="../">Cupped hakkında</a></p>
</main>
<script>
  // Kod yalnızca harf, rakam ve tire olabilir (sayfaya başka bir şey yazılmasın)
  var raw = new URLSearchParams(location.search).get('c') || '';
  var code = raw.toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 12);
  if (code) {
    document.getElementById('code').textContent = code;
    var url = 'cupped://match?code=' + encodeURIComponent(code);
    document.getElementById('open').href = url;
    // Uygulama yüklüyse doğrudan aç (yüklü değilse sayfa olduğu gibi kalır)
    setTimeout(function () { location.href = url; }, 300);
  }
</script>
</body>
</html>
